<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Upload Penjualan Jago</title>
    <!-- Memuat library PapaParse untuk membaca CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 90%; max-width: 450px; text-align: center; }
        h2 { color: #2c3e50; margin-top: 0; }
        p.subtitle { color: #7f8c8d; margin-bottom: 25px; font-size: 14px; line-height: 1.5; }
        .upload-area { border: 2px dashed #3498db; border-radius: 8px; padding: 30px; margin-bottom: 20px; background-color: #f0f8ff; transition: background-color 0.3s; }
        .upload-area:hover { background-color: #e1f0fa; }
        input[type="file"] { display: none; }
        .custom-file-upload { display: inline-block; padding: 10px 20px; cursor: pointer; background-color: #3498db; color: white; border-radius: 6px; font-weight: bold; margin-bottom: 10px; }
        .custom-file-upload:hover { background-color: #2980b9; }
        #fileName { font-size: 13px; color: #555; font-weight: bold; margin-top: 10px; display: block; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #2196f3; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        #pesan { margin-top: 15px; font-weight: bold; font-size: 14px; padding: 10px; border-radius: 5px; display: none; }
        .berhasil { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .gagal { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .proses { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="container">
    <h2>Upload Laporan Penjualan</h2>
    <p class="subtitle">Sistem akan otomatis mengambil tanggal, menghitung Unsold (Leftover + Expired), dan membuang kolom yang tidak perlu.</p>
    
    <div class="upload-area">
        <label for="csvFile" class="custom-file-upload">
            Pilih File CSV
        </label>
        <input type="file" id="csvFile" accept=".csv" />
        <span id="fileName">Belum ada file dipilih</span>
    </div>
    
    <button id="btnProses" disabled>Proses & Kirim ke Sheets</button>
    
    <div id="pesan"></div>
</div>

<script>
    // PASTE URL APPS SCRIPT ANDA DI DALAM TANDA KUTIP DI BAWAH INI:
    const scriptURL = 'URL_APPS_SCRIPT_ANDA_DI_SINI'; 
    
    const fileInput = document.getElementById('csvFile');
    const fileNameDisplay = document.getElementById('fileName');
    const btnProses = document.getElementById('btnProses');
    const pesanDiv = document.getElementById('pesan');
    
    let parsedData = [];

    function showPesan(teks, tipe) {
        pesanDiv.innerText = teks;
        pesanDiv.className = tipe;
        pesanDiv.style.display = 'block';
    }

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) {
            fileNameDisplay.innerText = "Belum ada file dipilih";
            btnProses.disabled = true;
            return;
        }
        
        fileNameDisplay.innerText = "File terpilih: " + file.name;
        
        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const rawData = results.data;
                parsedData = [];
                
                for (let i = 0; i < rawData.length; i++) {
                    let row = rawData[i];
                    
                    if(row['Jagoan ID']) {
                        let nama = row['Name'] || '';
                        let id = row['Jagoan ID'] || '';
                        
                        let fullDate = row['Approved At'] || '';
                        let tanggalSaja = fullDate;
                        if(fullDate.length > 9) {
                            tanggalSaja = fullDate.substring(0, 9);
                        }
                        
                        let item = row['Item Name'] || '';
                        let sold = parseInt(row['Sold']) || 0;
                        
                        let expired = parseInt(row['Expired']) || 0;
                        let leftover = parseInt(row['Leftover']) || 0;
                        let unsold = leftover + expired;
                        
                        parsedData.push([
                            nama,
                            id,
                            tanggalSaja,
                            item,
                            sold,
                            unsold,
                            expired,
                            leftover
                        ]);
                    }
                }
                
                if(parsedData.length > 0) {
                    btnProses.disabled = false;
                    btnProses.innerText = `Kirim ${parsedData.length} Data ke Sheets`;
                    showPesan(`Berhasil membaca ${parsedData.length} baris data yang valid dari CSV. Siap dikirim!`, "berhasil");
                } else {
                    btnProses.disabled = true;
                    showPesan("Tidak ada data yang valid ditemukan di dalam file CSV ini.", "gagal");
                }
            },
            error: function(err) {
                showPesan("Gagal membaca file CSV: " + err, "gagal");
            }
        });
    });

    btnProses.addEventListener('click', function() {
        if(parsedData.length === 0) return;
        
        btnProses.disabled = true;
        fileInput.disabled = true;
        btnProses.innerText = 'Sedang Mengirim Data...';
        showPesan("Sedang mengirim data ke Google Sheets, mohon tunggu...", "proses");

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(parsedData),
            headers: {
                'Content-Type': 'text/plain;charset=utf-8',
            }
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'sukses') {
                showPesan("Luar biasa! " + data.pesan, "berhasil");
                fileInput.value = '';
                fileNameDisplay.innerText = "Belum ada file dipilih";
                btnProses.innerText = "Proses & Kirim ke Sheets";
                btnProses.disabled = true;
                fileInput.disabled = false;
            } else {
                showPesan("Gagal: " + data.pesan, "gagal");
                btnProses.innerText = "Coba Kirim Lagi";
                btnProses.disabled = false;
                fileInput.disabled = false;
            }
        })
        .catch(error => {
            showPesan("Terjadi kesalahan koneksi/pengiriman: " + error, "gagal");
            btnProses.innerText = "Coba Kirim Lagi";
            btnProses.disabled = false;
            fileInput.disabled = false;
        });
    });
</script>

</body>
</html>
