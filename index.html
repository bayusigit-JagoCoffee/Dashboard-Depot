<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Upload Penjualan Jago</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h2 { color: #2c3e50; margin-top: 0; }
        p.subtitle { color: #7f8c8d; margin-bottom: 25px; font-size: 14px; line-height: 1.5; }
        .upload-area { border: 2px dashed #3498db; border-radius: 8px; padding: 40px 20px; margin-bottom: 20px; background-color: #f0f8ff; transition: all 0.3s; cursor: pointer; }
        .upload-area:hover, .upload-area.dragover { background-color: #d6eaf8; border-color: #2980b9; }
        input[type="file"] { display: none; }
        .custom-file-upload { display: inline-block; padding: 10px 20px; cursor: pointer; background-color: #3498db; color: white; border-radius: 6px; font-weight: bold; margin-bottom: 10px; pointer-events: none; }
        #fileName { font-size: 13px; color: #555; font-weight: bold; margin-top: 10px; display: block; word-break: break-all; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #2196f3; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        #pesan { margin-top: 15px; font-weight: bold; font-size: 13px; padding: 10px; border-radius: 5px; display: none; text-align: left; }
        .berhasil { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .gagal { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .proses { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="container">
    <h2>Upload Laporan Penjualan</h2>
    <p class="subtitle">Sistem mendeteksi kolom otomatis. Anda bisa klik area di bawah atau langsung *Drag & Drop* file CSV ke sini.</p>
    
    <!-- Area klik dan Drag & Drop -->
    <div class="upload-area" id="dropZone" onclick="document.getElementById('csvFile').click()">
        <span class="custom-file-upload">Pilih File CSV</span>
        <input type="file" id="csvFile" accept=".csv" />
        <span id="fileName">Belum ada file dipilih (Atau tarik file ke sini)</span>
    </div>
    
    <button id="btnProses" disabled>Proses & Kirim ke Sheets</button>
    
    <div id="pesan"></div>
</div>

<script>
    // PASTE URL APPS SCRIPT ANDA DI DALAM TANDA KUTIP DI BAWAH INI:
    const scriptURL = 'https://script.google.com/u/0/home/projects/1Gppz1FQJhDC2AUvjVNZblBLaOmjP_ICRCjDsfmha7Sc2uOXuP9inhRHf/edit'; 
    
    const fileInput = document.getElementById('csvFile');
    const fileNameDisplay = document.getElementById('fileName');
    const btnProses = document.getElementById('btnProses');
    const pesanDiv = document.getElementById('pesan');
    const dropZone = document.getElementById('dropZone');
    
    let parsedData = [];

    function showPesan(teks, tipe) {
        pesanDiv.innerHTML = teks; // Gunakan innerHTML agar bisa membuat baris baru
        pesanDiv.className = tipe;
        pesanDiv.style.display = 'block';
    }

    // Fitur Drag & Drop
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault(); dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; fileInput.dispatchEvent(new Event('change')); }
    });

    // Proses Baca File
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) { fileNameDisplay.innerText = "Belum ada file dipilih"; btnProses.disabled = true; return; }
        
        fileNameDisplay.innerText = "File terpilih: " + file.name;
        showPesan("Sedang membaca format file...", "proses");
        
        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            transformHeader: function(h) { return h.replace(/^\uFEFF/, '').trim(); }, // Membuang karakter gaib BOM
            complete: function(results) {
                const rawData = results.data;
                parsedData = [];
                
                if (rawData.length === 0) { showPesan("File CSV kosong.", "gagal"); return; }
                
                // Cek kolom apa saja yang sebenarnya dibaca oleh sistem
                const kolomTerdeteksi = Object.keys(rawData[0]);
                
                for (let i = 0; i < rawData.length; i++) {
                    let row = rawData[i];
                    
                    // Kita buat sangat fleksibel: Cek huruf kecil/besar
                    let id = row['Jagoan ID'] || row['Jagoan Id'] || row['jagoan id'] || '';
                    let nama = row['Name'] || row['name'] || '';
                    
                    if(id || nama) { // Jika ada ID atau Nama, proses baris ini
                        let fullDate = row['Approved At'] || '';
                        let tanggalSaja = fullDate.length > 9 ? fullDate.substring(0, 9) : fullDate;
                        
                        let item = row['Item Name'] || '';
                        let sold = parseInt(row['Sold']) || 0;
                        let expired = parseInt(row['Expired']) || 0;
                        let leftover = parseInt(row['Leftover']) || 0;
                        let unsold = leftover + expired;
                        
                        parsedData.push([ nama, id, tanggalSaja, item, sold, unsold, expired, leftover ]);
                    }
                }
                
                if(parsedData.length > 0) {
                    btnProses.disabled = false;
                    btnProses.innerText = `Kirim ${parsedData.length} Data ke Sheets`;
                    showPesan(`Berhasil membaca ${parsedData.length} baris data.<br>Kolom Anda cocok! Silakan klik tombol kirim.`, "berhasil");
                } else {
                    btnProses.disabled = true;
                    // TAMPILKAN ERROR DETEKTIF:
                    showPesan(`<b>Data ditolak.</b> Sistem gagal mendeteksi kolom "Jagoan ID".<br><br><b>Kolom yang dibaca sistem dari file Anda:</b><br> ${kolomTerdeteksi.join(", ")}`, "gagal");
                }
            },
            error: function(err) { showPesan("Gagal membaca file: " + err, "gagal"); }
        });
    });

    // Proses Kirim Data
    btnProses.addEventListener('click', function() {
        if(parsedData.length === 0) return;
        btnProses.disabled = true; dropZone.style.pointerEvents = 'none';
        btnProses.innerText = 'Sedang Mengirim Data...';
        showPesan("Sedang mengirim data ke Google Sheets, mohon tunggu...", "proses");

        fetch(scriptURL, { method: 'POST', body: JSON.stringify(parsedData), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'sukses') {
                showPesan("Luar biasa! " + data.pesan, "berhasil");
                setTimeout(() => { location.reload(); }, 3000); // Otomatis refresh setelah sukses
            } else {
                showPesan("Gagal: " + data.pesan, "gagal");
                btnProses.innerText = "Coba Kirim Lagi"; btnProses.disabled = false; dropZone.style.pointerEvents = 'auto';
            }
        }).catch(error => {
            showPesan("Terjadi kesalahan koneksi: " + error, "gagal");
            btnProses.innerText = "Coba Kirim Lagi"; btnProses.disabled = false; dropZone.style.pointerEvents = 'auto';
        });
    });
</script>

</body>
</html>
