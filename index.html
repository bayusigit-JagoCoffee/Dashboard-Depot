<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pencatatan Data</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistem Pencatatan Bayu</h2>
    <p class="subtitle">Masukkan data arus kas ke sistem</p>
    
    <div class="form-group">
        <label for="masuk">Nominal Masuk (Rp):</label>
        <input type="number" id="masuk" placeholder="Contoh: 3780000">
    </div>
    
    <div class="form-group">
        <label for="keluar">Nominal Keluar (Rp):</label>
        <input type="number" id="keluar" placeholder="Contoh: 600000">
    </div>
    
    <!-- Tombol sementara untuk tes tampilan -->
    <button onclick="alert('Tampilan website berhasil dibuat! Nanti tombol ini akan kita hubungkan ke spreadsheet otomatisasi.')">Simpan Data</button>
    
    <div class="footer">
        &copy; 2026 - Dibuat dengan GitHub Pages
    </div>
</div>

</body>
</html>
